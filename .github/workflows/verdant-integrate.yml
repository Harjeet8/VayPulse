name: Verdant Final Integration

on:
  push:
    branches: [phytosense-verdant-final]
    paths: ['.github/workflows/verdant-integrate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phytosense-verdant-final
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main phytosense-v8-ultra-final
      - name: Apply additive September 3 edge sync
        shell: bash
        run: |
          set -euo pipefail
          commits=(
            1f054e0d3700ba66a33156737a352253c97a063a
            5280b8f14b51579c2b6de619e3c28ee48bd2b66e
            3fe3a3e19599ec04299b7b3c058937c3ffccd95d
            86ff5918600d466ab385429d7cfb9aa281c7a6d8
            c7bf9d553ee93926cc5949aef05a28b4d79e086e
            1108ac8d6953fd608240a632d792108ddebc705d
            4a7bfa973de38b6f84945242b9105b5fbca18be3
            dfdfcb8b3f78a28d9ee8ebd1d4d8481464a6b054
            b7c5284ecc3ab078481e144cae373e48784db49b
            3a666b162023a13ceaf2fd4caec45bc205da43cf
          )
          for c in "${commits[@]}"; do
            echo "Applying $c"
            if ! git cherry-pick "$c"; then
              echo "VERDANT_CONFLICT=$c"
              git status --short
              exit 1
            fi
          done
      - name: Push integrated baseline
        run: git push origin HEAD:phytosense-verdant-final
