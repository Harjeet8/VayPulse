name: Final Calibre Integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/calibre-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: main
          path: patch-source

      - name: Checkout competition branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          path: competition

      - name: Apply additive calibre integration
        run: python patch-source/tools/calibre_integration_patch.py

      - name: Commit final competition changes
        working-directory: competition
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/live_node_home_screen.dart \
                  lib/simulation/simulated_sensor_provider.dart \
                  lib/widgets/calibre_upgrade_panels.dart
          if git diff --cached --quiet; then
            echo "No integration changes needed."
          else
            git commit -m "Integrate final calibre and simulation upgrade"
            git push origin HEAD:phytosense-v8-ultra-final
          fi
