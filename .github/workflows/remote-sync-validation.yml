name: Remote Sync Final Validation

on:
  push:
    branches: [remote-monitoring-final-sync]
    paths: ['.github/workflows/remote-sync-validation.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout remote sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format final source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if ! git diff --quiet -- lib test pubspec.lock; then
            git config user.name "PhytoSense Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add lib test pubspec.lock
            git commit -m "Format and lock remote monitoring synchronization"
            git push origin HEAD:remote-monitoring-final-sync
          fi

      - name: Static analysis
        run: flutter analyze

      - name: All tests
        run: flutter test

      - name: Secret and Firebase safety scan
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('lib'), Path('android')]
          bad = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'"private_key"\s*:'),
              re.compile(r'"client_email"\s*:\s*"[^"]+gserviceaccount\.com"'),
              re.compile(r'FirebaseOptions\([^)]*databaseURL[^)]*apiKey\s*:', re.S),
              re.compile(r'(?i)(firebase|database)[_-]?(secret|token)\s*[:=]\s*["\'][^"\']+'),
          ]
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.dart','.kt','.kts','.xml','.json','.properties'}:
                      continue
                  text = p.read_text(encoding='utf-8', errors='ignore')
                  for pattern in bad:
                      if pattern.search(text):
                          hits.append(f'{p}: {pattern.pattern}')
          if Path('android/app/google-services.json').exists():
              raise SystemExit('google-services.json must be supplied outside the repository')
          if hits:
              raise SystemExit('\n'.join(hits))
          print('No privileged Firebase/server credentials found in tracked app source.')

      - name: Validate Android build without Firebase project config
        run: flutter build apk --debug
