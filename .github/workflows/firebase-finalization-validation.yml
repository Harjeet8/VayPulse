name: Firebase Project Finalization Validation

on:
  push:
    branches: [firebase-project-finalization]
    paths: ['.github/workflows/firebase-finalization-validation.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          dart format .
          if ! git diff --quiet; then
            git config user.name "PhytoSense Build Bot"
            git config user.email "actions@users.noreply.github.com"
            git add .
            git commit -m "Format final Firebase remote monitoring pass"
            git push origin HEAD:firebase-project-finalization
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Security scan
        shell: python
        run: |
          from pathlib import Path
          import re

          text = "\n".join(
              p.read_text(encoding="utf-8", errors="ignore")
              for root in [Path("lib"), Path("android")]
              if root.exists()
              for p in root.rglob("*")
              if p.is_file()
          )
          forbidden = [
              r"phytosense@gmail\.com",
              r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              r'"private_key"\s*:',
              r'"client_email"\s*:\s*"[^"]+gserviceaccount\.com"',
              r"(?i)(firebase|database)[_-]?(secret|token)\s*[:=]",
              r"(?i)(routerPassword|wifiPassword|wiFiPassword|staPassword)\s*[:=]",
              r"(?i)refresh[_-]?token\s*[:=]",
          ]
          hits = [pattern for pattern in forbidden if re.search(pattern, text)]
          if Path("android/app/google-services.json").exists():
              raise SystemExit("google-services.json must be supplied externally, not committed.")
          if hits:
              raise SystemExit("Forbidden credential pattern(s): " + ", ".join(hits))
          print("No ESP32 writer credentials, router passwords, admin keys, or tokens found.")

      - name: Verify pinned Firebase target
        shell: bash
        run: |
          set -euo pipefail
          rg -q "phytosense-ai-1b0d8" lib/services/firebase_remote_client.dart FIREBASE_SETUP.md
          rg -q "https://phytosense-ai-1b0d8-default-rtdb.asia-southeast1.firebasedatabase.app" lib/services/firebase_remote_client.dart FIREBASE_SETUP.md
          rg -q "phytosense/nodes/phytosense_01/live" lib/services/firebase_remote_client.dart FIREBASE_SETUP.md

      - name: Android build without Firebase project file
        run: flutter build apk --debug
