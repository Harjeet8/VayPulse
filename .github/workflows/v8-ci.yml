name: PhytoSense AI Competition CI
# Builds the PhytoSense AI Atlas correction pass from the preserved patch.

on:
  push:
    branches:
      - phytosense-v8-ultra-final
  pull_request:
    branches:
      - phytosense-v8-ultra-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PhytoSense AI
        uses: actions/checkout@v4

      - name: Apply PhytoSense AI Atlas correction
        shell: bash
        run: |
          set -euo pipefail
          cat .github/atlas_patch/part-* | base64 --decode | gzip --decompress > /tmp/phytosense-atlas.patch
          git apply --check /tmp/phytosense-atlas.patch
          git apply /tmp/phytosense-atlas.patch

      - name: Verify release structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e lib/screens/onboarding_screen.dart
          test ! -e lib/screens/competition_center_screen.dart
          test ! -e lib/screens/presentation_mode_screen.dart
          test ! -e lib/screens/engineering_center_screen.dart
          grep -q '^version: 8.7.1+871$' pubspec.yaml
          test -f assets/fonts/NotoSansTamil-Regular.ttf
          grep -q 'family: NotoSansTamil' pubspec.yaml
          grep -q "FarmerAnalysisScreen" lib/screens/shell_screen.dart
          grep -q "LiveSensorsScreen" lib/screens/shell_screen.dart
          grep -q "ObservationTimelineScreen" lib/screens/shell_screen.dart
          grep -q "LeafScreeningScreen" lib/screens/shell_screen.dart
          grep -q "SettingsScreen" lib/screens/shell_screen.dart
          test -f lib/screens/practice_farm_home_screen.dart
          test -f lib/widgets/live_icon.dart
          test -f lib/widgets/phytosense_boot_mark.dart
          grep -q "LiveNodeHomeScreen" lib/screens/home_screen.dart
          ! grep -q "PracticeFarmHomeScreen" lib/screens/home_screen.dart
          grep -q "PhytoSenseBootMark" lib/screens/splash_screen.dart
          ! grep -R "VayPulse\|Vay Pulse" lib/l10n web --include='*.dart' --include='*.html' --include='*.json'
          grep -q "Welcome to PhytoSense AI" lib/l10n/app_strings.dart
          grep -q "பைட்டோ சென்ஸ் ஏஐ" lib/l10n/app_strings.dart
          ! grep -R "experienceMode\|setExperienceMode\|onboardingComplete" lib --include='*.dart'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Strict Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Chrome web release build
        run: flutter build web --release

      - name: Android release APK
        run: flutter build apk --release

      - name: Package PhytoSense AI Atlas build
        shell: bash
        run: |
          set -euo pipefail
          zip -r "PhytoSense-AI-Atlas-Source.zip" . \
            -x ".git/*" ".dart_tool/*" "build/*" "android/.gradle/*" \
               ".flutter-plugins" ".flutter-plugins-dependencies" "*.zip" \
               ".github/atlas_patch/*"
          cp build/app/outputs/flutter-apk/app-release.apk "PhytoSense-AI-Atlas.apk"

      - name: Upload PhytoSense AI Atlas artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-Atlas
          path: |
            PhytoSense-AI-Atlas-Source.zip
            PhytoSense-AI-Atlas.apk
          if-no-files-found: error
          retention-days: 30
