name: PhytoSense AI Release CI

on:
  push:
    branches:
      - phytosense-v8-ultra-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout private PhytoSense AI source
        uses: actions/checkout@v4

      - name: Apply approved Atlas UI correction
        shell: bash
        run: |
          set -euo pipefail
          cat .github/atlas_patch/part-* | base64 --decode | gzip --decompress > /tmp/phytosense-atlas.patch
          git apply --check /tmp/phytosense-atlas.patch
          git apply /tmp/phytosense-atlas.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/live_node_home_screen.dart')
          lines = path.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip() == 'const LiveBrandIcon(size: 28),':
                  if i >= 2 and lines[i - 2].strip() == 'child: Row(':
                      lines[i - 2] = lines[i - 2].replace('child: Row(', 'child: const Row(', 1)
                      lines[i] = line.replace('const LiveBrandIcon', 'LiveBrandIcon', 1)
                      lines[i + 1] = lines[i + 1].replace('const SizedBox', 'SizedBox', 1)
                      lines[i + 2] = lines[i + 2].replace('const Flexible', 'Flexible', 1)
                  break
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Apply Uptodown release hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/release_hardening.b64 | gzip --decompress > /tmp/phytosense-release.patch
          git apply --check /tmp/phytosense-release.patch
          git apply /tmp/phytosense-release.patch

      - name: Make continuous-animation regression test deterministic
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/animation_test_fix.b64 | gzip --decompress > /tmp/phytosense-animation-test.patch
          git apply --check /tmp/phytosense-animation-test.patch
          git apply /tmp/phytosense-animation-test.patch

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Source security scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIlE 'https?://(localhost|127\.0\.0\.1|10\.0\.2\.2)|staging\.|dev\.|example\.com|test-api' lib android/app/src/main web --include='*.dart' --include='*.kt' --include='*.xml' --include='*.json' --include='*.html' | grep -q .; then
            echo 'Release blocked: development endpoint found.'
            exit 1
          fi
          if grep -RIlE '\b(debugPrint|print)[[:space:]]*\(' lib android/app/src/main --include='*.dart' --include='*.kt' | grep -q .; then
            echo 'Release blocked: debug logging call found.'
            exit 1
          fi
          if grep -RIlE '(api[_-]?key|client[_-]?secret|password|secret)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' lib android/app/src/main web --include='*.dart' --include='*.kt' --include='*.xml' --include='*.json' --include='*.html' | grep -q .; then
            echo 'Release blocked: credential-like literal found.'
            exit 1
          fi
          if grep -RIlE 'VayPulse|Vay Pulse' lib web android/app/src/main --include='*.dart' --include='*.kt' --include='*.xml' --include='*.json' --include='*.html' | grep -q .; then
            echo 'Release blocked: legacy branding found.'
            exit 1
          fi

      - name: Strict Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Create isolated CI release signer
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 32)"
          STORE="$RUNNER_TEMP/phytosense-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$STORE" -storetype JKS \
            -storepass "$PASS" -keypass "$PASS" \
            -alias phytosense-ci -keyalg RSA -keysize 4096 \
            -sigalg SHA256withRSA -validity 365 \
            -dname 'CN=PhytoSense CI Release, OU=Release Validation, O=PhytoSense AI, C=IN'
          echo "PHYTOSENSE_KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
          echo "PHYTOSENSE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "PHYTOSENSE_KEY_ALIAS=phytosense-ci" >> "$GITHUB_ENV"
          echo "PHYTOSENSE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Obfuscated Android release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --obfuscate --split-debug-info="$RUNNER_TEMP/phytosense-symbols"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify release hardening
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='com.harjeet.phytosense'" /tmp/badging.txt
          if grep -q 'application-debuggable' /tmp/badging.txt; then
            echo 'Release blocked: APK is debuggable.'
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$APK" > /tmp/cert.txt
          if grep -qi 'Android Debug' /tmp/cert.txt; then
            echo 'Release blocked: debug signing certificate detected.'
            exit 1
          fi
          test -s build/app/outputs/mapping/release/mapping.txt
          grep -q 'isMinifyEnabled = true' android/app/build.gradle.kts
          grep -q 'isShrinkResources = true' android/app/build.gradle.kts
          if unzip -l "$APK" | grep -Eq '\.map$|/test/|/tests/|debug-symbols'; then
            echo 'Release blocked: development artifact packaged.'
            exit 1
          fi
          rm -rf /tmp/phyto-apk && mkdir -p /tmp/phyto-apk
          unzip -qq "$APK" -d /tmp/phyto-apk
          while IFS= read -r -d '' so; do
            if readelf -S "$so" 2>/dev/null | grep -Eq '\.debug_(info|line|str|abbrev|ranges|loc)'; then
              echo "Release blocked: packaged native library contains debug sections: ${so#/tmp/phyto-apk/}"
              exit 1
            fi
          done < <(find /tmp/phyto-apk/lib -type f -name '*.so' -print0)
          find /tmp/phyto-apk/lib -name libapp.so -type f -exec strings {} + > /tmp/phyto-strings.txt
          if grep -Eqi 'https?://(localhost|127\.0\.0\.1|10\.0\.2\.2)([:/]|$)|https?://[^[:space:]]*(example\.com|staging\.|test-api)|VayPulse|Vay Pulse' /tmp/phyto-strings.txt; then
            echo 'Release blocked: actual development URL or legacy branding found in app payload.'
            exit 1
          fi
          if grep -Eq 'AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|gh[pousr]_[0-9A-Za-z]{30,}' /tmp/phyto-strings.txt; then
            echo 'Release blocked: credential pattern found in app payload.'
            exit 1
          fi
          grep -Fq '© 2026 Harjeet. All rights reserved.' /tmp/phyto-strings.txt
          grep -Fq 'PhytoSense AI is an original project created by Harjeet.' /tmp/phyto-strings.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'com.harjeet.phytosense.COPYRIGHT' /tmp/manifest.txt
          grep -q 'com.harjeet.phytosense.ORIGINAL_PROJECT' /tmp/manifest.txt

      - name: Android release install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=build/app/outputs/flutter-apk/app-release.apk
            adb install -r "$APK"
            adb shell am force-stop com.harjeet.phytosense
            adb shell am start -W -n com.harjeet.phytosense/.MainActivity
            sleep 8
            test -n "$(adb shell pidof com.harjeet.phytosense | tr -d '\r')"
            adb shell uiautomator dump /sdcard/phytosense-ui.xml >/dev/null
            adb pull /sdcard/phytosense-ui.xml /tmp/phytosense-ui.xml >/dev/null
            grep -q 'PhytoSense' /tmp/phytosense-ui.xml

      - name: Package generic release APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk PhytoSense-AI.apk
          sha256sum PhytoSense-AI.apk > PhytoSense-AI.apk.sha256

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI
          path: |
            PhytoSense-AI.apk
            PhytoSense-AI.apk.sha256
          if-no-files-found: error
          retention-days: 30
