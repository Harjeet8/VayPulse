name: PhytoSense AI Competition CI
# Builds the PhytoSense AI Atlas correction pass from the preserved patch.

on:
  push:
    branches:
      - phytosense-v8-ultra-final
  pull_request:
    branches:
      - phytosense-v8-ultra-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PhytoSense AI
        uses: actions/checkout@v4

      - name: Apply PhytoSense AI Atlas correction
        shell: bash
        run: |
          set -euo pipefail
          cat .github/atlas_patch/part-* | base64 --decode | gzip --decompress > /tmp/phytosense-atlas.patch
          git apply --check /tmp/phytosense-atlas.patch
          git apply /tmp/phytosense-atlas.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/live_node_home_screen.dart')
          lines = path.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip() == 'const LiveBrandIcon(size: 28),':
                  if i < 2 or lines[i - 2].strip() != 'child: Row(':
                      raise SystemExit('Unexpected Atlas Home title structure')
                  lines[i - 2] = lines[i - 2].replace('child: Row(', 'child: const Row(', 1)
                  lines[i] = line.replace('const LiveBrandIcon', 'LiveBrandIcon', 1)
                  lines[i + 1] = lines[i + 1].replace('const SizedBox', 'SizedBox', 1)
                  lines[i + 2] = lines[i + 2].replace('const Flexible', 'Flexible', 1)
                  break
          else:
              raise SystemExit('Atlas Home brand icon not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
          echo 'Atlas correction applied.'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Strict Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Chrome web release build
        run: flutter build web --release

      - name: Android release APK
        run: flutter build apk --release

      - name: Package PhytoSense AI Atlas build
        shell: bash
        run: |
          set -euo pipefail
          zip -r "PhytoSense-AI-Atlas-Source.zip" . \
            -x ".git/*" ".dart_tool/*" "build/*" "android/.gradle/*" \
               ".flutter-plugins" ".flutter-plugins-dependencies" "*.zip" \
               ".github/atlas_patch/*"
          cp build/app/outputs/flutter-apk/app-release.apk "PhytoSense-AI-Atlas.apk"

      - name: Upload PhytoSense AI Atlas artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-Atlas
          path: |
            PhytoSense-AI-Atlas-Source.zip
            PhytoSense-AI-Atlas.apk
          if-no-files-found: error
          retention-days: 30
