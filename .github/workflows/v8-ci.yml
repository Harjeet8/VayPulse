name: PhytoSense AI v8.7.1 MEGA FINAL CI

on:
  push:
    branches:
      - phytosense-v8-ultra-final
  pull_request:
    branches:
      - phytosense-v8-ultra-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V8
        uses: actions/checkout@v4

      - name: Verify release structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e lib/screens/onboarding_screen.dart
          test ! -e lib/screens/competition_center_screen.dart
          test ! -e lib/screens/presentation_mode_screen.dart
          test ! -e lib/screens/engineering_center_screen.dart
          grep -q '^version: 8.7.1+871$' pubspec.yaml
          test -f assets/fonts/NotoSansTamil-Regular.ttf
          grep -q 'family: NotoSansTamil' pubspec.yaml
          grep -q "const FarmerAnalysisScreen" lib/screens/shell_screen.dart
          grep -q "const LiveSensorsScreen" lib/screens/shell_screen.dart
          grep -q "const ObservationTimelineScreen" lib/screens/shell_screen.dart
          grep -q "const LeafScreeningScreen" lib/screens/shell_screen.dart
          grep -q "const SettingsScreen" lib/screens/shell_screen.dart
          ! grep -R "experienceMode\|setExperienceMode\|onboardingComplete" lib --include='*.dart'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Strict Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Chrome web release build
        run: flutter build web --release

      - name: Android release APK
        run: flutter build apk --release

      - name: Package v8.7.1 MEGA FINAL
        shell: bash
        run: |
          set -euo pipefail
          zip -r "PhytoSense-AI-v8.7.1-MEGA-FINAL.zip" . \
            -x ".git/*" ".dart_tool/*" "build/*" "android/.gradle/*" \
               ".flutter-plugins" ".flutter-plugins-dependencies" "*.zip" \
               ".github/v8-validation-trigger.txt"
          cp build/app/outputs/flutter-apk/app-release.apk "PhytoSense-AI-v8.7.1-MEGA-FINAL.apk"

      - name: Upload v8.7.1 MEGA FINAL artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-v8.7.1-MEGA-FINAL
          path: |
            PhytoSense-AI-v8.7.1-MEGA-FINAL.zip
            PhytoSense-AI-v8.7.1-MEGA-FINAL.apk
          if-no-files-found: error
          retention-days: 30
