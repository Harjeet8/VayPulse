name: Format Electrode Sync Once

on:
  push:
    branches: [main-electrode-integrity-final]
    paths: ['.github/workflows/format-electrode-sync-once.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-electrode-integrity-final
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib test
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add lib test
          git commit -m "style: apply Dart formatter to electrode sync"
          git push origin HEAD:main-electrode-integrity-final
