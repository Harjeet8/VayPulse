name: Enhance PhytoSense Creator Profile

on:
  pull_request:
    branches:
      - phytosense-v8-ultra-final
    paths:
      - '.github/creator-enhance-trigger.txt'

permissions:
  contents: write

jobs:
  enhance-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout competition branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final

      - name: Enhance creator profile
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/about_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_builder = """                tamil
                    ? 'Embedded systems, sensing மற்றும் நடைமுறை AI மீது கவனம் செலுத்தும் student builder.'
                    : 'Student builder focused on embedded systems, sensing and practical AI.',
                style: TextStyle(color: scheme.onSurfaceVariant),
              ),
            ),
            const SizedBox(height: 16),
            _CreatorBuild(
              title: 'PhytoSense AI',"""

          new_builder = """                tamil
                    ? 'Raw sensor physics முதல் embedded intelligence மற்றும் user-facing software வரை end-to-end systems உருவாக்கும் student builder.'
                    : 'Student builder creating end-to-end systems from raw sensor physics to embedded intelligence and user-facing software.',
                style: TextStyle(color: scheme.onSurfaceVariant),
              ),
            ),
            const SizedBox(height: 14),
            Container(
              width: double.infinity,
              padding: const EdgeInsets.all(13),
              decoration: BoxDecoration(
                color: scheme.primaryContainer.withValues(alpha: 0.32),
                borderRadius: BorderRadius.circular(16),
              ),
              child: Text(
                tamil
                    ? 'Hardware • Firmware • Signal processing • AI logic • App — ஒரே build pipeline.'
                    : 'Hardware • Firmware • Signal processing • AI logic • App — one build pipeline.',
                style: const TextStyle(fontWeight: FontWeight.w800),
              ),
            ),
            const SizedBox(height: 16),
            _CreatorBuild(
              title: 'PhytoSense AI',"""

          if old_builder not in text:
              raise SystemExit('Creator builder marker not found')
          text = text.replace(old_builder, new_builder, 1)

          aura_marker = """            const SizedBox(height: 11),
            _CreatorBuild(
              title: 'AURA',"""

          echo_block = """            const SizedBox(height: 11),
            _CreatorBuild(
              title: 'EchoSkin AI',
              description: tamil
                  ? 'Piezo vibration sensing, ESP8266 signal analysis, Wi-Fi dashboard மற்றும் actuator response பயன்படுத்தும் structural-health monitoring prototype.'
                  : 'Structural-health monitoring prototype using piezo vibration sensing, ESP8266 signal analysis, a Wi-Fi dashboard and actuator response.',
            ),
            const SizedBox(height: 11),
            _CreatorBuild(
              title: 'AURA',"""

          if aura_marker not in text:
              raise SystemExit('AURA insertion marker not found')
          text = text.replace(aura_marker, echo_block, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit enhanced creator profile
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/about_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Add EchoSkin and sharpen creator profile"
          git push origin HEAD:phytosense-v8-ultra-final
