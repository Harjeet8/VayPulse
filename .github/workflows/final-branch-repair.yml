name: Final Branch Repair

on:
  push:
    branches: [phytosense-v8-ultra-final]
    paths: ['.github/workflows/final-branch-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repaired ultra-final app
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze current repaired app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyzer-report.txt

      - name: Test current repaired app
        continue-on-error: true
        run: flutter test 2>&1 | tee test-report.txt

      - name: Build current installable APK
        run: flutter build apk --debug 2>&1 | tee build-report.txt

      - name: Locate and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "Packaging $APK"
          cp "$APK" PhytoSense-AI-ULTRA-FINAL-LATEST.apk
          ls -lh PhytoSense-AI-ULTRA-FINAL-LATEST.apk

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-ULTRA-FINAL-LATEST
          path: |
            PhytoSense-AI-ULTRA-FINAL-LATEST.apk
            analyzer-report.txt
            test-report.txt
            build-report.txt
          if-no-files-found: error
          retention-days: 7
