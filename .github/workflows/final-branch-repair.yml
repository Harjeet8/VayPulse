name: Final Branch Repair

on:
  push:
    branches: [phytosense-v8-ultra-final]
    paths: ['.github/workflows/final-branch-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ultra-final app
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove duplicate compatibility fields
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/models/sensor_reading.dart')
          s = p.read_text(encoding='utf-8')

          fixes = [
            (
              "  final bool edgeAnalysisAvailable;\n\n  /// Compatibility/provenance fields retained for the existing intelligence\n  /// panels and persisted readings. These are additive to the newer firmware\n  /// authority fields below.\n  final String analysisOrigin;\n  final bool recoveryActive;\n  final double? vpdKpa;\n\n",
              "  final bool edgeAnalysisAvailable;\n\n",
            ),
            (
              "    this.recoveryActive = false,\n    this.edgeAnalysisAvailable = true,\n    this.analysisOrigin = 'persisted',\n    this.recoveryActive = false,\n    this.vpdKpa,\n",
              "    this.recoveryActive = false,\n    this.edgeAnalysisAvailable = true,\n",
            ),
            (
              "    'recoveryActive': recoveryActive,\n    'edgeAnalysisAvailable': edgeAnalysisAvailable,\n    'analysisOrigin': analysisOrigin,\n    'recoveryActive': recoveryActive,\n    'vpdKpa': vpdKpa,\n",
              "    'recoveryActive': recoveryActive,\n    'edgeAnalysisAvailable': edgeAnalysisAvailable,\n",
            ),
            (
              "      edgeAnalysisAvailable: json['edgeAnalysisAvailable'] != false,\n      analysisOrigin: '${json['analysisOrigin'] ?? 'persisted'}',\n      recoveryActive: json['recoveryActive'] == true,\n      vpdKpa: _nullableNum(json['vpdKpa']),\n",
              "      edgeAnalysisAvailable: json['edgeAnalysisAvailable'] != false,\n",
            ),
            (
              "    bool? recoveryActive,\n    bool? edgeAnalysisAvailable,\n    String? analysisOrigin,\n    bool? recoveryActive,\n    double? vpdKpa,\n",
              "    bool? recoveryActive,\n    bool? edgeAnalysisAvailable,\n",
            ),
            (
              "      edgeAnalysisAvailable:\n          edgeAnalysisAvailable ?? this.edgeAnalysisAvailable,\n      analysisOrigin: analysisOrigin ?? this.analysisOrigin,\n      recoveryActive: recoveryActive ?? this.recoveryActive,\n      vpdKpa: vpdKpa ?? this.vpdKpa,\n",
              "      edgeAnalysisAvailable:\n          edgeAnalysisAvailable ?? this.edgeAnalysisAvailable,\n",
            ),
          ]

          for old, new in fixes:
            if old in s:
              s = s.replace(old, new, 1)

          # Hard guard: the model must contain exactly one declaration of each
          # compatibility field after cleanup.
          assert s.count('final String analysisOrigin;') == 1, s.count('final String analysisOrigin;')
          assert s.count('final bool recoveryActive;') == 1, s.count('final bool recoveryActive;')
          assert s.count('final double? vpdKpa;') == 1, s.count('final double? vpdKpa;')

          p.write_text(s, encoding='utf-8')

      - name: Format repaired files
        run: dart format lib/models/sensor_reading.dart lib/services/esp32_client.dart

      - name: Commit repaired model
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/models/sensor_reading.dart lib/services/esp32_client.dart
          if ! git diff --cached --quiet; then
            git commit -m "Fix duplicate ultra-final compatibility fields"
            git push origin HEAD:phytosense-v8-ultra-final
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired app
        run: flutter analyze --no-fatal-infos

      - name: Test repaired app
        run: flutter test

      - name: Build installable APK
        run: flutter build apk --debug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" PhytoSense-AI-ULTRA-FINAL-LATEST.apk
          ls -lh PhytoSense-AI-ULTRA-FINAL-LATEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-ULTRA-FINAL-LATEST
          path: PhytoSense-AI-ULTRA-FINAL-LATEST.apk
          if-no-files-found: error
          retention-days: 7
