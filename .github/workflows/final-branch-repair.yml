name: Final Branch Repair

on:
  push:
    branches: [phytosense-v8-ultra-final]
    paths: ['.github/workflows/final-branch-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repaired ultra-final app
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore ultra-final SensorReading compatibility
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/models/sensor_reading.dart')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("  final double analysisConfidence;\n  final bool edgeAnalysisAvailable;", "  final double analysisConfidence;\n  final String analysisOrigin;\n  final double? vpdKpa;\n  final bool recoveryActive;\n  final bool edgeAnalysisAvailable;"),
            ("    this.analysisConfidence = 0,\n    this.edgeAnalysisAvailable = true,", "    this.analysisConfidence = 0,\n    this.analysisOrigin = 'persisted',\n    this.vpdKpa,\n    this.recoveryActive = false,\n    this.edgeAnalysisAvailable = true,"),
            ("        'analysisConfidence': analysisConfidence,\n        'edgeAnalysisAvailable': edgeAnalysisAvailable,", "        'analysisConfidence': analysisConfidence,\n        'analysisOrigin': analysisOrigin,\n        'vpdKpa': vpdKpa,\n        'recoveryActive': recoveryActive,\n        'edgeAnalysisAvailable': edgeAnalysisAvailable,"),
            ("      analysisConfidence: _bounded(\n        _nullableNum(json['analysisConfidence']) ?? 0,\n      ),\n      edgeAnalysisAvailable: json['edgeAnalysisAvailable'] != false,", "      analysisConfidence: _bounded(\n        _nullableNum(json['analysisConfidence']) ?? 0,\n      ),\n      analysisOrigin: '${json['analysisOrigin'] ?? 'persisted'}',\n      vpdKpa: _nullableNum(json['vpdKpa']),\n      recoveryActive: json['recoveryActive'] == true ||\n          '${json['recoveryStatus'] ?? ''}'.toUpperCase() == 'RECOVERING' ||\n          '${json['reliabilityMode'] ?? ''}'.toUpperCase() == 'RECOVERING',\n      edgeAnalysisAvailable: json['edgeAnalysisAvailable'] != false,"),
            ("    double? analysisConfidence,\n    bool? edgeAnalysisAvailable,", "    double? analysisConfidence,\n    String? analysisOrigin,\n    double? vpdKpa,\n    bool? recoveryActive,\n    bool? edgeAnalysisAvailable,"),
            ("      analysisConfidence: analysisConfidence ?? this.analysisConfidence,\n      edgeAnalysisAvailable:", "      analysisConfidence: analysisConfidence ?? this.analysisConfidence,\n      analysisOrigin: analysisOrigin ?? this.analysisOrigin,\n      vpdKpa: vpdKpa ?? this.vpdKpa,\n      recoveryActive: recoveryActive ?? this.recoveryActive,\n      edgeAnalysisAvailable:"),
          ]
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new, 1)
            elif new not in s:
              raise SystemExit(f'Missing SensorReading patch anchor: {old[:80]}')
          p.write_text(s, encoding='utf-8')

          p = Path('lib/services/esp32_client.dart')
          s = p.read_text(encoding='utf-8')
          anchor = "      'analysisConfidence': espConfidence ?? 0,\n      'edgeAnalysisAvailable': espHealth != null,"
          replacement = "      'analysisConfidence': espConfidence ?? 0,\n      'analysisOrigin': 'esp32',\n      'vpdKpa': _asDouble(first([data['vpdKpa'], analysis['vpdKpa']])),\n      'recoveryActive': reliabilityMode == 'RECOVERING' ||\n          '${first([data['recoveryStatus'], recovery['status'], recovery['state'], ''])}'.toUpperCase() == 'RECOVERING',\n      'edgeAnalysisAvailable': espHealth != null,"
          if anchor in s:
            s = s.replace(anchor, replacement, 1)
          elif replacement not in s:
            raise SystemExit('Missing ESP32 normalized-map patch anchor')
          p.write_text(s, encoding='utf-8')

      - name: Format compatibility repair
        run: dart format lib/models/sensor_reading.dart lib/services/esp32_client.dart

      - name: Commit compatibility repair immediately
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/models/sensor_reading.dart lib/services/esp32_client.dart
          if ! git diff --cached --quiet; then
            git commit -m "Restore ultra-final model compatibility after ESP32 sync"
            git push origin HEAD:phytosense-v8-ultra-final
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired app
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyzer-report.txt

      - name: Test repaired app
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test-report.txt

      - name: Build current installable APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build-report.txt

      - name: Locate and package APK
        if: steps.build_apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Packaging $APK"
          cp "$APK" PhytoSense-AI-ULTRA-FINAL-LATEST.apk
          ls -lh PhytoSense-AI-ULTRA-FINAL-LATEST.apk

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-ULTRA-FINAL-LATEST
          path: |
            PhytoSense-AI-ULTRA-FINAL-LATEST.apk
            analyzer-report.txt
            test-report.txt
            build-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce repaired app checks
        if: steps.analyze.outcome != 'success' || steps.tests.outcome != 'success' || steps.build_apk.outcome != 'success'
        run: exit 1
