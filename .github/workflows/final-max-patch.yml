name: Final Max Potential Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: main
          path: patch-source

      - name: Checkout competition branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          path: app

      - name: Apply additive integration
        working-directory: app
        run: python ../patch-source/tools/final_max_patch.py

      - name: Commit competition changes
        working-directory: app
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/live_node_home_screen.dart lib/screens/judge_view_screen.dart lib/screens/splash_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Integrate max-potential competition experience"
          git push origin HEAD:phytosense-v8-ultra-final
