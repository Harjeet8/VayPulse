name: Build Exact Frozen PhytoSense APK

on:
  push:
    branches: [build-latest-apk-20260904]
    paths: ['.github/workflows/build-latest-apk-20260904.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact frozen source
        uses: actions/checkout@v4

      - name: Verify frozen commit ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1a080ee27ec56415dc1e24af3bd4a2b8633a1e38 HEAD
          grep -Fq "plantModelStatus" lib/models/sensor_reading.dart
          grep -Fq "ESP32 Edge Intelligence" lib/screens/engineering_center_screen.dart
          grep -Fq "_FarmerEdgeSignals" lib/screens/live_node_home_screen.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and verify
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Create temporary install signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "${RUNNER_TEMP}/phytosense-temp.jks" \
            -storepass phytosense-temp-20260904 \
            -keypass phytosense-temp-20260904 \
            -alias phytosense-temp \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=PhytoSense AI Temporary Build,O=PhytoSense AI,C=IN"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/phytosense-temp.jks" >> "${GITHUB_ENV}"
          echo "ANDROID_STORE_PASSWORD=phytosense-temp-20260904" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=phytosense-temp" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=phytosense-temp-20260904" >> "${GITHUB_ENV}"

      - name: Build latest release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --obfuscate --split-debug-info="${RUNNER_TEMP}/symbols"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk PhytoSense-AI-LATEST-2026-09-04.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "${build_tools}/apksigner" verify --verbose PhytoSense-AI-LATEST-2026-09-04.apk
          app_id="$("${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id PhytoSense-AI-LATEST-2026-09-04.apk)"
          test "${app_id}" = "com.harjeet.phytosense"
          "${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable PhytoSense-AI-LATEST-2026-09-04.apk | grep -qx 'false'
          sha256sum PhytoSense-AI-LATEST-2026-09-04.apk

      - name: Upload latest APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-LATEST-2026-09-04
          path: PhytoSense-AI-LATEST-2026-09-04.apk
          if-no-files-found: error
          retention-days: 3
