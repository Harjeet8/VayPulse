name: Fix Final Analyzer Issues Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-analyzer-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply four analyzer-only fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/screens/live_node_home_screen.dart',
              """                  Text(\n                    '${reading.reliabilityMode} reliability',\n                    style: TextStyle(fontWeight: FontWeight.w900),\n                  ),""",
              """                  Text(\n                    '${reading.reliabilityMode} reliability',\n                    style: const TextStyle(fontWeight: FontWeight.w900),\n                  ),""",
          )

          replace_once(
              'lib/screens/settings_screen.dart',
              """    final scope = AppScope.of(context);\n    final language = scope.settings.value.languageCode;\n    setState(() => previewing = true);\n    final prepared = await scope.voice.prepareVoice(language);\n    final spoken = await scope.voice.speak(\n      text: context.tr('voice_preview_sample'),\n      languageCode: language,\n    );""",
              """    final scope = AppScope.of(context);\n    final language = scope.settings.value.languageCode;\n    final previewText = context.tr('voice_preview_sample');\n    final unavailableText = context.tr('voice_unavailable');\n    setState(() => previewing = true);\n    final prepared = await scope.voice.prepareVoice(language);\n    final spoken = await scope.voice.speak(\n      text: previewText,\n      languageCode: language,\n    );""",
          )
          replace_once(
              'lib/screens/settings_screen.dart',
              """      ).showSnackBar(SnackBar(content: Text(context.tr('voice_unavailable'))));""",
              """      ).showSnackBar(SnackBar(content: Text(unavailableText)));""",
          )

          replace_once(
              'lib/services/esp32_client.dart',
              """    if (direct != null && DateTime.tryParse('$direct') != null)\n      return '$direct';""",
              """    if (direct != null && DateTime.tryParse('$direct') != null) {\n      return '$direct';\n    }""",
          )

          replace_once(
              'lib/services/health_analysis_engine.dart',
              """    if (!reading.daytime || reading.lightAvailable)\n      available += weights['light']!;""",
              """    if (!reading.daytime || reading.lightAvailable) {\n      available += weights['light']!;\n    }""",
          )
          PY

      - name: Format touched files
        run: dart format lib/screens/live_node_home_screen.dart lib/screens/settings_screen.dart lib/services/esp32_client.dart lib/services/health_analysis_engine.dart

      - name: Prove analyzer is clean
        run: flutter analyze

      - name: Commit analyzer-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/live_node_home_screen.dart lib/screens/settings_screen.dart lib/services/esp32_client.dart lib/services/health_analysis_engine.dart
          git diff --cached --check
          git commit -m "Fix final release analyzer issues"
          git push origin HEAD:main
