name: Fix PhytoSense Competition Analyzer

on:
  push:
    branches:
      - phytosense-v8-ultra-final

permissions:
  contents: write

jobs:
  fix-unused-helper:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0

      - name: Remove obsolete time helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/live_node_home_screen.dart')
          s = p.read_text()
          old = """String _time(DateTime value) {
            final local = value.toLocal();
            String two(int n) => n.toString().padLeft(2, '0');
            return '${two(local.hour)}:${two(local.minute)}:${two(local.second)}';
          }

          """
          if old not in s:
              raise SystemExit('obsolete helper not found')
          p.write_text(s.replace(old, '', 1))

      - name: Commit analyzer fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-competition-analyzer.yml
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete competition helper"
          git push origin HEAD:phytosense-v8-ultra-final
