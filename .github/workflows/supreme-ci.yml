name: SUPREME CI

on:
  push:
    branches:
      - main
      - phytosense-ai-supreme
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Package
        run: |
          zip -r "PhytoSense AI SUPREME.zip" . -x ".git/*" ".dart_tool/*" "build/*" "*.zip"
          cp build/app/outputs/flutter-apk/app-release.apk "PhytoSense AI SUPREME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-SUPREME
          path: |
            PhytoSense AI SUPREME.zip
            PhytoSense AI SUPREME.apk
          if-no-files-found: error
          retention-days: 30
