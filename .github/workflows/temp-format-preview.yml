name: Temporary Dart Format Preview

on:
  push:
    branches:
      - fix-notifications-problem-solution

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Format and print changed files
        shell: bash
        run: |
          dart format lib/services/alert_service.dart lib/services/farmer_language_service.dart
          echo '=== ALERT_SERVICE_BEGIN ==='
          cat lib/services/alert_service.dart
          echo '=== ALERT_SERVICE_END ==='
          echo '=== FARMER_LANGUAGE_BEGIN ==='
          cat lib/services/farmer_language_service.dart
          echo '=== FARMER_LANGUAGE_END ==='
