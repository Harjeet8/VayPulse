name: Build PhytoSense AI Test APK Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-test-apk-once.yml'

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify source
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build installable debug APK
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk PhytoSense-AI-Test.apk

      - name: Verify package ID
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          app_id="$("${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id PhytoSense-AI-Test.apk)"
          test "${app_id}" = "com.harjeet.phytosense"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-Test
          path: PhytoSense-AI-Test.apk
          if-no-files-found: error
          retention-days: 7
