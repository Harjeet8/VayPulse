name: Edge AI Branch Format and Validate

on:
  push:
    branches: [edge-ai-final-sync]

permissions:
  contents: write

jobs:
  format-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-ai-final-sync
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply Dart formatter
        run: dart format lib test
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib test
          git diff --cached --check
          git commit -m "Format final edge intelligence sync" || true
          git push origin HEAD:edge-ai-final-sync
      - name: Static analysis
        run: flutter analyze
      - name: All tests
        run: flutter test
