name: Format Final Source With Current Stable Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-final-3472-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: dart format lib test

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib test
          if git diff --cached --quiet; then
            echo "Source is already formatted."
            exit 0
          fi
          git commit -m "Format final source with Flutter stable 3.47.2"
          git push origin HEAD:main
