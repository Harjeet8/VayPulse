name: Verdant Crown Phone Test APK

on:
  push:
    branches: [phytosense-verdant-final]
    paths:
      - '.github/workflows/verdant-test-apk.yml'
      - 'lib/**'
      - 'assets/branding/**'
      - 'android/app/src/main/res/**'
      - 'pubspec.yaml'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validated Verdant source
        uses: actions/checkout@v4
        with:
          ref: phytosense-verdant-final

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze additive animation changes
        run: flutter analyze --no-fatal-infos

      - name: Run regression tests
        run: flutter test

      - name: Build phone-test APK
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk PhytoSense_AI_VERDANT_CROWN_TEST.apk

      - name: Verify package identity
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          app_id="$("${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id PhytoSense_AI_VERDANT_CROWN_TEST.apk)"
          test "${app_id}" = "com.harjeet.phytosense"

      - name: Upload phone-test APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-VERDANT-CROWN-TEST-APK
          path: PhytoSense_AI_VERDANT_CROWN_TEST.apk
          if-no-files-found: error
          retention-days: 14
