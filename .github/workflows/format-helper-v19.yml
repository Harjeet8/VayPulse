name: Temporary Dart Formatter Helper v19

on:
  push:
    branches:
      - format-helper-v19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Print exact formatted files
        run: |
          echo "===CLIENT_START==="
          dart format --output=show lib/services/esp32_client.dart
          echo "===CLIENT_END==="
          echo "===TEST_START==="
          dart format --output=show test/remote_hardware_sync_test.dart
          echo "===TEST_END==="
