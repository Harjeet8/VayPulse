name: Apply PhytoSense Competition Polish

on:
  push:
    branches:
      - phytosense-v8-ultra-final

permissions:
  contents: write

jobs:
  apply-polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0

      - name: Apply staged competition source
        shell: bash
        run: |
          set -euo pipefail
          test -f .phytosense/competition_polish.tar.gz
          tar -xzf .phytosense/competition_polish.tar.gz
          test -f lib/screens/live_node_home_screen.dart
          test -f lib/screens/splash_screen.dart
          test -f lib/screens/judge_view_screen.dart
          rm -f .phytosense/competition_polish.tar.gz
          rmdir .phytosense 2>/dev/null || true
          rm -f .github/workflows/apply-competition-polish.yml

      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Apply competition reliability and launch polish"
          git push origin HEAD:phytosense-v8-ultra-final
