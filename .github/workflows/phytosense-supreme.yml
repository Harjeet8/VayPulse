name: PhytoSense AI SUPREME

on:
  push:
    branches: [phytosense-ai-supreme]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Package source
        run: |
          zip -r "PhytoSense AI SUPREME.zip" . \
            -x ".git/*" ".dart_tool/*" "build/*" "*.zip"
          cp build/app/outputs/flutter-apk/app-release.apk "PhytoSense AI SUPREME.apk"

      - name: Upload SUPREME bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-SUPREME
          path: |
            PhytoSense AI SUPREME.zip
            PhytoSense AI SUPREME.apk
          if-no-files-found: error
          retention-days: 30
