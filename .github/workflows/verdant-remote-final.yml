name: PhytoSense Verdant Remote Final

on:
  push:
    branches:
      - phytosense-verdant-remote-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout authoritative Verdant source
        uses: actions/checkout@v4

      - name: Verify authoritative lineage and locked contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "phytosense-verdant-remote-final"
          grep -q '^version: 10.2.0+1003$' pubspec.yaml
          test -f assets/branding/phytosense_icon.png
          test -f assets/fonts/NotoSansTamil-Regular.ttf
          test -f android/app/src/main/res/drawable/ic_stat_phytosense.xml
          grep -Fq "Real Time Signal" lib/models/sensor_reading.dart
          grep -Fq "HardwareTransportMode" lib/services/esp32_sensor_provider.dart
          grep -Fq "FirebaseRemoteClient" lib/services/esp32_sensor_provider.dart
          grep -Fq "phytosense-ai-1b0d8" lib/services/firebase_remote_client.dart
          grep -Fq "schemaVersion! <= 9" lib/models/edge_intelligence.dart
          grep -Fq "192.168.29.5" lib/services/esp32_client.dart
          grep -Fq ".setSmallIcon(R.drawable.ic_stat_phytosense)" \
            android/app/src/main/kotlin/com/harjeet/phytosense/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format sources
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git config user.name "PhytoSense CI"
            git config user.email "actions@users.noreply.github.com"
            git add lib test
            git commit -m "Format market redesign sources"
            git push origin HEAD:phytosense-verdant-remote-final
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run full regression suite
        env:
          PHYTO_PREVIEWS: '1'
        run: flutter test

      - name: Voice gateway policy tests
        run: node --test server/voice/policy.test.mjs

      - name: Export actual Flutter preview images
        if: always()
        run: |
          python - <<'PYCODE'
          import pathlib,base64
          for p in pathlib.Path('build/visual-review').glob('*.png'):
              print('PHYTO_PREVIEW='+p.name+':'+base64.b64encode(p.read_bytes()).decode())
          PYCODE

      - name: Create release install signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          KEYSTORE="$RUNNER_TEMP/phytosense-verdant-market.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias phytosense \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=PhytoSense AI Verdant Market Build,O=PhytoSense AI,C=IN"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_STORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=phytosense"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build obfuscated Android release APK
        env:
          PHYTO_VOICE_ENDPOINT: ${{ vars.PHYTO_VOICE_ENDPOINT }}
        run: >
          flutter build apk --release
          --obfuscate
          --dart-define=PHYTO_FREE_VOICE=true
          --dart-define="PHYTO_VOICE_ENDPOINT=$PHYTO_VOICE_ENDPOINT"
          --split-debug-info="$RUNNER_TEMP/symbols"

      - name: Verify APK identity, signature, and release flags
        shell: bash
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          OUT="PhytoSense-AI-VERDANT-MARKET-10.2.0-1003.apk"
          test -s "$SRC"
          cp "$SRC" "$OUT"
          unzip -t "$OUT" >/dev/null
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$OUT"
          app_id="$("$sdk_root/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$OUT")"
          test "$app_id" = "com.harjeet.phytosense"
          "$sdk_root/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$OUT" | grep -qx 'false'
          sha256sum "$OUT" | tee "$OUT.sha256"
          size="$(stat -c%s "$OUT")"
          {
            echo "## Verified PhytoSense Android release"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Version: 10.2.0+1003"
            echo "- Package: com.harjeet.phytosense"
            echo "- Debuggable: false"
            echo "- APK bytes: $size"
            echo "- SHA-256: $(cut -d' ' -f1 "$OUT.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK handoff
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-VERDANT-MARKET-10.2.0-1003
          path: |
            PhytoSense-AI-VERDANT-MARKET-10.2.0-1003.apk
            PhytoSense-AI-VERDANT-MARKET-10.2.0-1003.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="PhytoSense-AI-VERDANT-MARKET-10.2.0-1003.apk"
          TAG="phytosense-v10.2.0-verdant-care-$(git rev-parse --short HEAD)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" "$OUT.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$OUT" "$OUT.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "PhytoSense AI 10.2.0 — Verdant Market" \
              --notes "Verified farmer-first PhytoSense AI Android release from the authoritative phytosense-verdant-remote-final branch. Package com.harjeet.phytosense; release-obfuscated; debuggable=false."
          fi

      - name: Non-GitHub verified APK handoff
        shell: bash
        run: |
          set -euo pipefail
          OUT="PhytoSense-AI-VERDANT-MARKET-10.2.0-1003.apk"
          response="$(curl --fail-with-body --silent --show-error --max-time 120 --retry 2 -F "file=@$OUT" https://upload.gofile.io/uploadfile)"
          url="$(jq -r '.data.downloadPage // empty' <<<"$response")"
          test -n "$url"
          echo "PHYTO_APK_URL=$url"
          echo "APK_BYTES=$(stat -c%s "$OUT")"
          echo "APK_COMMIT=$(git rev-parse HEAD)"
