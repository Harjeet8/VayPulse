name: PhytoSense Verdant Remote Final

on:
  push:
    branches:
      - phytosense-verdant-remote-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout integrated Verdant source
        uses: actions/checkout@v4

      - name: Verify newest integrated lineage
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 9.1.4+905$' pubspec.yaml
          test -f assets/branding/phytosense_icon.png
          test -f assets/fonts/NotoSansTamil-Regular.ttf
          grep -Fq "TimePhaseCard" lib/screens/live_node_home_screen.dart
          grep -Fq "Full plant intelligence" lib/screens/live_node_home_screen.dart
          grep -Fq "Real Time Signal" lib/models/sensor_reading.dart
          grep -Fq "HardwareTransportMode" lib/services/esp32_sensor_provider.dart
          grep -Fq "FirebaseRemoteClient" lib/services/esp32_sensor_provider.dart
          grep -Fq "phytosense-ai-1b0d8" lib/services/firebase_remote_client.dart
          grep -Fq "schemaVersion! <= 9" lib/models/edge_intelligence.dart
          grep -Fq "192.168.29.5" lib/services/esp32_client.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run regression tests
        run: flutter test

      - name: Create temporary install signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/phytosense-verdant-remote.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias phytosense \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=PhytoSense AI Verdant Remote Build,O=PhytoSense AI,C=IN"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_STORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=phytosense"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build newest release APK
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info="$RUNNER_TEMP/symbols"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          OUT="PhytoSense-AI-VERDANT-REMOTE-FINAL-9.1.4-905.apk"
          test -s "$SRC"
          cp "$SRC" "$OUT"
          unzip -t "$OUT" >/dev/null
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose "$OUT"
          app_id="$("$sdk_root/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$OUT")"
          test "$app_id" = "com.harjeet.phytosense"
          "$sdk_root/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$OUT" | grep -qx 'false'
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Publish verified APK handoff
        shell: bash
        run: |
          set -euo pipefail
          OUT="PhytoSense-AI-VERDANT-REMOTE-FINAL-9.1.4-905.apk"
          test -s "$OUT"

          url="$(curl --fail-with-body --silent --show-error             -F "reqtype=fileupload"             -F "fileToUpload=@$OUT"             https://catbox.moe/user/api.php || true)"

          if [[ ! "$url" =~ ^https:// ]]; then
            response="$(curl --fail-with-body --silent --show-error               -F "file=@$OUT"               https://tmpfiles.org/api/v1/upload || true)"
            url="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("data",{}).get("url",""))' "$response" 2>/dev/null || true)"
          fi

          if [[ ! "$url" =~ ^https:// ]]; then
            echo "No external handoff service accepted the verified APK."
            exit 1
          fi

          echo "PHYTO_APK_URL=$url"
