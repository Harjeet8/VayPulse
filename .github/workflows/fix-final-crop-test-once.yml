name: Fix Final Crop Screening Test Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-crop-test-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Align crop screening regression with the production contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/widget_test.dart')
          text = p.read_text()
          old = """  test('all ten Tamil Nadu crop contexts produce crop-specific candidates', () {\n    final visual = LeafScreeningResult(\n      riskKey: 'leaf_result_spot_risk',\n      explanationKey: 'leaf_result_spot_risk_body',\n      actionKey: 'leaf_action_spot',\n      confidence: 78,\n      greenPercent: 42,\n      yellowPercent: 24,\n      brownPercent: 22,\n      screenedAt: DateTime.now(),\n    );\n    expect(CropCatalog.supported, hasLength(14));\n    for (final crop in CropCatalog.supported) {\n      final assessment = MultimodalDiseaseService.assess(\n        visual: visual,\n        crop: crop.name,\n        reading: reading(\n          soil: 42,\n          temperature: 30,\n          humidity: 82,\n          plantSignal: 32,\n          health: 58,\n        ),\n      );\n      expect(assessment.candidates, isNotEmpty, reason: crop.name);\n      expect(\n        assessment.candidates.every(\n          (candidate) => candidate.nameKey.contains(crop.id),\n        ),\n        isTrue,\n        reason: crop.name,\n      );\n    }\n  });\n"""
          new = """  test(\n    'crop-specific camera contexts stay specific and other profiles stay generic',\n    () {\n      final visual = LeafScreeningResult(\n        riskKey: 'leaf_result_spot_risk',\n        explanationKey: 'leaf_result_spot_risk_body',\n        actionKey: 'leaf_action_spot',\n        confidence: 78,\n        greenPercent: 42,\n        yellowPercent: 24,\n        brownPercent: 22,\n        screenedAt: DateTime.now(),\n      );\n      const cropSpecificIds = <String>{\n        'tomato',\n        'rice',\n        'sugarcane',\n        'banana',\n        'eggplant',\n        'maize',\n        'groundnut',\n        'cotton',\n        'coconut',\n        'chilli',\n      };\n      expect(CropCatalog.supported, hasLength(14));\n      for (final crop in CropCatalog.supported) {\n        final assessment = MultimodalDiseaseService.assess(\n          visual: visual,\n          crop: crop.name,\n          reading: reading(\n            soil: 42,\n            temperature: 30,\n            humidity: 82,\n            plantSignal: 32,\n            health: 58,\n          ),\n        );\n        expect(assessment.candidates, isNotEmpty, reason: crop.name);\n        if (cropSpecificIds.contains(crop.id)) {\n          final diseaseKeyId = crop.id == 'eggplant' ? 'brinjal' : crop.id;\n          expect(\n            assessment.candidates.every(\n              (candidate) => candidate.nameKey.contains(diseaseKeyId),\n            ),\n            isTrue,\n            reason: crop.name,\n          );\n        } else {\n          expect(\n            assessment.candidates.every(\n              (candidate) => candidate.nameKey.startsWith('disease_generic_'),\n            ),\n            isTrue,\n            reason: crop.name,\n          );\n        }\n      }\n    },\n  );\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old test block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Format test
        run: dart format test/widget_test.dart

      - name: Prove analyze and all tests
        run: |
          flutter analyze
          flutter test

      - name: Commit regression-test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/widget_test.dart
          git diff --cached --check
          git commit -m "Align crop screening test with firmware profiles"
          git push origin HEAD:main
