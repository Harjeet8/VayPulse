name: Build Repaired PhytoSense Unified Final

on:
  push:
    branches: [main]
    paths: ['.github/workflows/unify-final-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout repaired polished app
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0

      - name: Create frozen unified branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main phytosense-v8-ultra-final
          git checkout -B phytosense-unified-final origin/phytosense-v8-ultra-final

      - name: Verify repaired app contains final synchronization
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "assets/branding/phytosense_icon.png" lib/screens/splash_screen.dart
          grep -Fq "See stress before it becomes visible" lib/screens/splash_screen.dart
          grep -R -Fq "Real Time Signal" lib
          grep -R -Fq "Live Readings" lib
          grep -Fq "reliabilityMode" lib/models/sensor_reading.dart
          grep -Fq "farmerAction" lib/models/sensor_reading.dart
          grep -Fq "rootCauseConfidence" lib/models/sensor_reading.dart
          grep -Fq "cameraRecommended" lib/models/sensor_reading.dart
          grep -Eq "cameraInspectionRecommended|cameraRecommended" lib/screens/live_node_home_screen.dart
          grep -R -Fq "RECOVERING" lib
          grep -Fq "firmwareSupportedNames" lib/models/crop_catalog.dart

      - name: Apply permanent release identity and hardening
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .gitignore COPYRIGHT.md FREEZE.md android/app/build.gradle.kts android/app/proguard-rules.pro android/app/src/main/AndroidManifest.xml
          rm -f android/app/src/main/kotlin/ai/phytosense/app/MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/harjeet/phytosense
          git show origin/main:android/app/src/main/kotlin/com/harjeet/phytosense/MainActivity.kt > android/app/src/main/kotlin/com/harjeet/phytosense/MainActivity.kt
          git add -A
          git commit -m "Freeze repaired ultra-final app with permanent release identity" || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and validate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          git add lib test
          git commit -m "Format validated unified final source" || true

      - name: Configure permanent publisher signing
        shell: bash
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing $value" >&2
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/phytosense-publisher.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Build optimized signed APK
        shell: bash
        run: |
          set -euo pipefail
          symbol_dir="${RUNNER_TEMP}/phytosense-dart-symbols"
          flutter build apk --release --obfuscate --split-debug-info="${symbol_dir}"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk PhytoSense-AI-UNIFIED-FINAL.apk

      - name: Inspect final APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "${build_tools}/apksigner" verify --verbose PhytoSense-AI-UNIFIED-FINAL.apk
          app_id="$("${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id PhytoSense-AI-UNIFIED-FINAL.apk)"
          test "${app_id}" = "com.harjeet.phytosense"
          "${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable PhytoSense-AI-UNIFIED-FINAL.apk | grep -qx 'false'
          ls -lh PhytoSense-AI-UNIFIED-FINAL.apk

      - name: Push frozen unified branch
        run: git push --force origin HEAD:phytosense-unified-final

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-UNIFIED-FINAL
          path: PhytoSense-AI-UNIFIED-FINAL.apk
          if-no-files-found: error
          retention-days: 14

