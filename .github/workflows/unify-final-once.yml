name: Unify PhytoSense Final Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/unify-final-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout ultra-final base
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main phytosense-v8-ultra-final
          git checkout -B phytosense-unified-final origin/phytosense-v8-ultra-final
      - name: Replay September 3 hardware-sync commits
        shell: bash
        run: |
          set -euo pipefail
          for c in \
            1f054e0d3700ba66a33156737a352253c97a063a \
            5280b8f14b51579c2b6de619e3c28ee48bd2b66e \
            3fe3a3e19599ec04299b7b3c058937c3ffccd95d \
            86ff5918600d466ab385429d7cfb9aa281c7a6d8 \
            c7bf9d553ee93926cc5949aef05a28b4d79e086e \
            1108ac8d6953fd608240a632d792108ddebc705d \
            4a7bfa973de38b6f84945242b9105b5fbca18be3 \
            dfdfcb8b3f78a28d9ee8ebd1d4d8481464a6b054 \
            b7c5284ecc3ab078481e144cae373e48784db49b \
            3a666b162023a13ceaf2fd4caec45bc205da43cf; do
            git cherry-pick -X theirs "$c"
          done
          git checkout origin/phytosense-v8-ultra-final -- lib/screens/splash_screen.dart
          git add lib/screens/splash_screen.dart
          git commit -m "Preserve ultra-final animated splash" || true
      - name: Restore SensorReading compatibility superset
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('lib/models/sensor_reading.dart')
          text=p.read_text(encoding='utf-8')
          marker='  final double analysisConfidence;\n'
          specs=[
            ('analysisOrigin','  final String analysisOrigin;\n'),
            ('primaryRootCause','  final String? primaryRootCause;\n'),
            ('secondaryRootCause','  final String? secondaryRootCause;\n'),
            ('degradedAnalysis','  final bool degradedAnalysis;\n'),
            ('healthTrend','  final String? healthTrend;\n'),
            ('diseaseRiskTrend','  final String? diseaseRiskTrend;\n'),
            ('recoveryActive','  final bool recoveryActive;\n'),
            ('vpdKpa','  final double? vpdKpa;\n'),
            ('bioticState','  final String? bioticState;\n')]
          additions=[]
          for name,decl in specs:
            if not re.search(rf'final\s+[^;\n]+\s+{name};',text): additions.append(decl)
          if additions: text=text.replace(marker,marker+''.join(additions),1)
          p.write_text(text,encoding='utf-8')
      - name: Bring release identity and hardening from main
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .gitignore COPYRIGHT.md FREEZE.md android/app/build.gradle.kts android/app/proguard-rules.pro android/app/src/main/AndroidManifest.xml
          rm -f android/app/src/main/kotlin/ai/phytosense/app/MainActivity.kt
          mkdir -p android/app/src/main/kotlin/com/harjeet/phytosense
          git show origin/main:android/app/src/main/kotlin/com/harjeet/phytosense/MainActivity.kt > android/app/src/main/kotlin/com/harjeet/phytosense/MainActivity.kt
          git add -A
          git commit -m "Unify final release identity and compatibility"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve and format
        run: |
          flutter pub get
          dart format lib test
          git add lib test
          git commit -m "Format unified final source" || true
      - name: Analyze unified source
        run: flutter analyze --no-fatal-infos
      - name: Test unified source
        run: flutter test
      - name: Configure permanent publisher signing
        shell: bash
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing $value" >&2
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/phytosense-publisher.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
      - name: Build hardened unified release APK
        shell: bash
        run: |
          set -euo pipefail
          symbol_dir="${RUNNER_TEMP}/phytosense-unified-symbols"
          flutter build apk --release --obfuscate --split-debug-info="${symbol_dir}"
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk PhytoSense-AI-UNIFIED-FINAL.apk
      - name: Verify expected final UI and sync markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "assets/branding/phytosense_icon.png" lib/screens/splash_screen.dart
          grep -Fq "See stress before it becomes visible" lib/screens/splash_screen.dart
          rg -q "Real Time Signal" lib
          rg -q "Live Readings" lib
          rg -q "com.harjeet.phytosense" android/app/build.gradle.kts
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "${build_tools}/apksigner" verify --verbose PhytoSense-AI-UNIFIED-FINAL.apk
      - name: Push unified final branch
        run: git push --force origin HEAD:phytosense-unified-final
      - name: Upload unified APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-UNIFIED-FINAL
          path: PhytoSense-AI-UNIFIED-FINAL.apk
          if-no-files-found: error
          retention-days: 14

