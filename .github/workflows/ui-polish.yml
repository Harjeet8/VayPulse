name: Final UI Polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/ui-polish-trigger.txt'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: main
          path: patch-source

      - name: Checkout competition branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          path: competition

      - name: Apply UI and animation polish
        run: python patch-source/tools/ui_polish_patch_v2.py

      - name: Commit polished competition app
        working-directory: competition
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/live_node_home_screen.dart \
                  lib/screens/splash_screen.dart \
                  lib/widgets/calibre_upgrade_panels.dart \
                  lib/simulation/simulation_intelligence_v2.dart \
                  lib/l10n/app_strings.dart
          if git diff --cached --quiet; then
            echo "No UI polish changes needed."
          else
            git commit -m "Polish final UI animations and simulation experience"
            git push origin HEAD:phytosense-v8-ultra-final
          fi
