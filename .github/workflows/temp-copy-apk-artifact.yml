name: Copy Existing PhytoSense APK Artifact

on:
  push:
    branches:
      - fix-notifications-problem-solution

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK from private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download phytosense-latest-34447411480 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'PhytoSense-AI-REMOTE-AUTO-LATEST.apk' \
            --dir .
          test -s PhytoSense-AI-REMOTE-AUTO-LATEST.apk
          ls -lh PhytoSense-AI-REMOTE-AUTO-LATEST.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-Verdant-Latest
          path: PhytoSense-AI-REMOTE-AUTO-LATEST.apk
          if-no-files-found: error
          retention-days: 7
