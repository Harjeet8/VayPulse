name: Simulation Counter Evidence Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/sim-counter-fix-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: main
          path: patch-source

      - name: Checkout competition branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
          path: competition

      - name: Fix simulation evidence model
        run: python patch-source/tools/fix_sim_counterevidence.py

      - name: Commit fix
        working-directory: competition
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/simulation/simulation_intelligence_v2.dart
          if git diff --cached --quiet; then
            echo "No simulator fix needed."
          else
            git commit -m "Fix simulation counter-evidence model"
            git push origin HEAD:phytosense-v8-ultra-final
          fi
