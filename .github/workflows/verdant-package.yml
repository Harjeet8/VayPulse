name: PhytoSense AI Verdant Crown Package

on:
  push:
    branches: [phytosense-verdant-final]
    paths: ['.github/workflows/verdant-package.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phytosense-verdant-crown-package
  cancel-in-progress: false

jobs:
  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated Verdant source
        uses: actions/checkout@v4
        with:
          ref: phytosense-verdant-final
          fetch-depth: 0

      - name: Create unique source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verdant-source
          git archive --format=tar HEAD | tar -x -C /tmp/verdant-source
          cat > /tmp/verdant-source/VERDANT_BUILD_INFO.txt <<EOF
          PhytoSense AI — VERDANT CROWN FINAL
          Branch: phytosense-verdant-final
          Commit: $(git rev-parse HEAD)
          Source of truth: final polished pre-FieldPulse app, with additive final ESP32 sync and mobile fixes.
          Application ID: com.harjeet.phytosense
          EOF
          (cd /tmp/verdant-source && zip -qr "$GITHUB_WORKSPACE/PhytoSense_AI_VERDANT_CROWN_FINAL_SOURCE.zip" .)
          test -s PhytoSense_AI_VERDANT_CROWN_FINAL_SOURCE.zip

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-VERDANT-CROWN-SOURCE
          path: PhytoSense_AI_VERDANT_CROWN_FINAL_SOURCE.zip
          if-no-files-found: error
          retention-days: 30

  verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout validated Verdant source
        uses: actions/checkout@v4
        with:
          ref: phytosense-verdant-final
          fetch-depth: 0

      - name: Require permanent publisher signing
        shell: bash
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing $value. Refusing debug or temporary-key release." >&2
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/phytosense-publisher.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format gate
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run all tests
        run: flutter test

      - name: Ownership, source, signing, and URL guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)" = "com.harjeet.phytosense"
          grep -q 'Copyright © 2026 Harjeet' COPYRIGHT.md
          grep -q 'Copyright © 2026 Harjeet' lib/screens/about_screen.dart
          grep -q 'Copyright © 2026 Harjeet' android/app/src/main/AndroidManifest.xml
          if git ls-files | grep -E -i '(^|/)(key\.properties|.*\.(jks|keystore|p12|pfx|pem))$'; then
            echo 'Signing material is tracked by git.' >&2
            exit 1
          fi
          if grep -R -n -E --exclude-dir=.git --exclude=pubspec.lock \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35})' .; then
            echo 'A likely committed secret was found.' >&2
            exit 1
          fi
          if grep -R -n -E --include='*.dart' --include='*.xml' --include='*.gradle*' \
            '(https?://(localhost|127\.0\.0\.1|10\.0\.2\.2)|https?://[^/]*(dev|staging)\.)' lib android; then
            echo 'A development URL was found.' >&2
            exit 1
          fi
          ! grep -q 'signingConfigs.getByName("debug")' android/app/build.gradle.kts
          ! grep -R -n -E 'Trichy Tomato Plot|Trichy.Thanjavur deployment|FieldPulse' lib

      - name: Build obfuscated release APK
        shell: bash
        run: |
          set -euo pipefail
          symbol_dir="${RUNNER_TEMP}/verdant-dart-symbols"
          flutter build apk --release --obfuscate --split-debug-info="${symbol_dir}"
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -d "${symbol_dir}"
          test -s build/app/outputs/mapping/release/mapping.txt
          cp build/app/outputs/flutter-apk/app-release.apk PhytoSense_AI_VERDANT_CROWN_FINAL.apk

      - name: Inspect signed release APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          build_tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "${build_tools}/apksigner" verify --verbose PhytoSense_AI_VERDANT_CROWN_FINAL.apk
          app_id="$("${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest application-id PhytoSense_AI_VERDANT_CROWN_FINAL.apk)"
          test "${app_id}" = "com.harjeet.phytosense"
          "${sdk_root}/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable PhytoSense_AI_VERDANT_CROWN_FINAL.apk | grep -qx 'false'
          if unzip -Z1 PhytoSense_AI_VERDANT_CROWN_FINAL.apk | grep -E -i '(^|/)([^/]+\.(dart|kt|java|symbols)|mapping\.txt|.*debug.*\.json)$'; then
            echo 'Source, symbol, mapping, or debug metadata was packaged in the APK.' >&2
            exit 1
          fi

      - name: Android install and launch smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r PhytoSense_AI_VERDANT_CROWN_FINAL.apk
            adb shell am force-stop com.harjeet.phytosense
            adb shell am start -W -n com.harjeet.phytosense/.MainActivity | tee /tmp/verdant-launch.txt
            grep -q 'Status: ok' /tmp/verdant-launch.txt
            adb shell pidof com.harjeet.phytosense
            sleep 3
            adb shell uiautomator dump /sdcard/verdant-ui.xml || true
            adb pull /sdcard/verdant-ui.xml /tmp/verdant-ui.xml || true
            if [ -s /tmp/verdant-ui.xml ]; then
              grep -q 'PhytoSense AI' /tmp/verdant-ui.xml
            fi
            if adb logcat -d -t 500 | grep -A 4 'FATAL EXCEPTION: main' | grep -q 'com\.harjeet\.phytosense'; then
              echo 'PhytoSense AI crashed during launch smoke.' >&2
              exit 1
            fi

      - name: Create Verdant Crown final package ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verdant-package/source
          git archive --format=tar HEAD | tar -x -C /tmp/verdant-package/source
          cp PhytoSense_AI_VERDANT_CROWN_FINAL.apk /tmp/verdant-package/
          cat > /tmp/verdant-package/VERDANT_BUILD_INFO.txt <<EOF
          PhytoSense AI — VERDANT CROWN FINAL
          Branch: phytosense-verdant-final
          Commit: $(git rev-parse HEAD)
          APK: permanently publisher-signed, release mode, R8/resource shrinking enabled, Dart-obfuscated.
          Application ID: com.harjeet.phytosense
          Source of truth: polished pre-FieldPulse app plus additive final sync/fixes.
          Validation: format, analysis, 49 tests, signed APK inspection, Android install/launch smoke.
          IMPORTANT: Upload only the APK to an app store. The ZIP also contains private project source for the owner.
          EOF
          (cd /tmp/verdant-package && zip -qr "$GITHUB_WORKSPACE/PhytoSense_AI_VERDANT_CROWN_FINAL.zip" .)
          test -s PhytoSense_AI_VERDANT_CROWN_FINAL.zip

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-VERDANT-CROWN-APK
          path: PhytoSense_AI_VERDANT_CROWN_FINAL.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload owner final package
        uses: actions/upload-artifact@v4
        with:
          name: PhytoSense-AI-VERDANT-CROWN-FINAL-PACKAGE
          path: PhytoSense_AI_VERDANT_CROWN_FINAL.zip
          if-no-files-found: error
          retention-days: 30
