name: Fix AURA Software Credit

on:
  pull_request:
    branches:
      - phytosense-v8-ultra-final
    paths:
      - '.github/aura-credit-trigger.txt'

permissions:
  contents: write

jobs:
  patch-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout competition branch
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
      - name: Make AURA software-only explicit
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/screens/about_screen.dart')
          text = path.read_text(encoding='utf-8')

          pipeline_en = "Hardware • Firmware • Signal processing • AI logic • App — one build pipeline."
          pipeline_ta = "Hardware • Firmware • Signal processing • AI logic • App — ஒரே build pipeline."
          if pipeline_en not in text or pipeline_ta not in text:
              raise SystemExit('Missing creator pipeline text')
          text = text.replace(
              pipeline_en,
              "Across selected builds: Hardware • Firmware • Signal processing • AI logic • App.",
              1,
          )
          text = text.replace(
              pipeline_ta,
              "தேர்ந்தெடுக்கப்பட்ட builds-ல்: Hardware • Firmware • Signal processing • AI logic • App.",
              1,
          )

          old_aura = "Camera-driven elder-care emergency-response prototype with safety-first interaction design."
          if text.count(old_aura) < 2:
              raise SystemExit('Missing expected AURA descriptions')
          # In the Flutter ternary the Tamil branch appears first, then English.
          text = text.replace(
              old_aura,
              "Software-only elder-care emergency-response app — camera-driven workflows மற்றும் safety-first interaction design.",
              1,
          )
          text = text.replace(
              old_aura,
              "Software-only elder-care emergency-response app with camera-driven workflows and safety-first interaction design.",
              1,
          )
          path.write_text(text, encoding='utf-8')
      - name: Commit credit fix
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/about_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Clarify AURA as software-only work"
          git push origin HEAD:phytosense-v8-ultra-final
