name: Add PhytoSense Creator Card

on:
  push:
    paths:
      - '.github/workflows/add-creator-card.yml'

permissions:
  contents: write

jobs:
  patch-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phytosense-v8-ultra-final
      - name: Add understated creator card
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/about_screen.dart')
          text = path.read_text(encoding='utf-8')

          list_marker = """            ),\n          ],\n        ),\n      );\n}\n\nclass _FarmImpactEstimator"""
          if list_marker not in text:
              raise SystemExit('About-page insertion marker not found')
          text = text.replace(
              list_marker,
              """            ),\n            const SizedBox(height: 12),\n            const _CreatorCard(),\n          ],\n        ),\n      );\n}\n\nclass _CreatorCard extends StatelessWidget {\n  const _CreatorCard();\n\n  @override\n  Widget build(BuildContext context) {\n    final tamil = FarmerLanguage.isTamil(context);\n    final scheme = Theme.of(context).colorScheme;\n\n    return Card(\n      clipBehavior: Clip.antiAlias,\n      child: Theme(\n        data: Theme.of(context).copyWith(dividerColor: Colors.transparent),\n        child: ExpansionTile(\n          initiallyExpanded: false,\n          maintainState: true,\n          leading: Container(\n            width: 42,\n            height: 42,\n            decoration: BoxDecoration(\n              color: scheme.surfaceContainerHighest.withValues(alpha: 0.7),\n              borderRadius: BorderRadius.circular(14),\n            ),\n            child: Icon(Icons.person_outline_rounded, color: scheme.primary),\n          ),\n          title: Text(\n            tamil ? 'உருவாக்குநர்' : 'Creator',\n            style: const TextStyle(fontWeight: FontWeight.w900),\n          ),\n          subtitle: Text(\n            tamil\n                ? 'திட்ட ஆசிரியர் மற்றும் தேர்ந்தெடுக்கப்பட்ட உருவாக்கங்கள்'\n                : 'Project authorship & selected builds',\n          ),\n          childrenPadding: const EdgeInsets.fromLTRB(18, 0, 18, 18),\n          children: [\n            Align(\n              alignment: Alignment.centerLeft,\n              child: Text(\n                'Harjeet D.',\n                style: Theme.of(context).textTheme.titleLarge?.copyWith(\n                      fontWeight: FontWeight.w900,\n                    ),\n              ),\n            ),\n            const SizedBox(height: 4),\n            Align(\n              alignment: Alignment.centerLeft,\n              child: Text(\n                tamil\n                    ? 'Embedded systems, sensing மற்றும் நடைமுறை AI மீது கவனம் செலுத்தும் student builder.'\n                    : 'Student builder focused on embedded systems, sensing and practical AI.',\n                style: TextStyle(color: scheme.onSurfaceVariant),\n              ),\n            ),\n            const SizedBox(height: 16),\n            _CreatorBuild(\n              title: 'PhytoSense AI',\n              description: tamil\n                  ? 'ESP32 + Flutter plant-intelligence system — bioelectric sensing, environmental fusion மற்றும் farmer-first guidance.'\n                  : 'ESP32 + Flutter plant-intelligence system combining bioelectric sensing, environmental fusion and farmer-first guidance.',\n            ),\n            const SizedBox(height: 11),\n            _CreatorBuild(\n              title: 'AURA',\n              description: tamil\n                  ? 'Camera-driven elder-care emergency-response prototype with safety-first interaction design.'\n                  : 'Camera-driven elder-care emergency-response prototype with safety-first interaction design.',\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n}\n\nclass _CreatorBuild extends StatelessWidget {\n  final String title;\n  final String description;\n\n  const _CreatorBuild({required this.title, required this.description});\n\n  @override\n  Widget build(BuildContext context) => Row(\n        crossAxisAlignment: CrossAxisAlignment.start,\n        children: [\n          Padding(\n            padding: const EdgeInsets.only(top: 3),\n            child: Icon(\n              Icons.arrow_outward_rounded,\n              size: 17,\n              color: Theme.of(context).colorScheme.primary,\n            ),\n          ),\n          const SizedBox(width: 10),\n          Expanded(\n            child: Column(\n              crossAxisAlignment: CrossAxisAlignment.start,\n              children: [\n                Text(title, style: const TextStyle(fontWeight: FontWeight.w900)),\n                const SizedBox(height: 2),\n                Text(description),\n              ],\n            ),\n          ),\n        ],\n      );\n}\n\nclass _FarmImpactEstimator""",
              1,
          )
          path.write_text(text, encoding='utf-8')
      - name: Commit creator card
        run: |
          git config user.name "PhytoSense Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/about_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "Add understated creator profile to About"
          git push origin HEAD:phytosense-v8-ultra-final

# Triggered intentionally for the About-only creator section.
