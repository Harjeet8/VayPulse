name: Temporary Dart Format Diff

on:
  push:
    branches:
      - fix-notifications-problem-solution

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Print formatter diff
        shell: bash
        run: |
          dart format lib/services/alert_service.dart lib/services/farmer_language_service.dart
          git diff -- lib/services/alert_service.dart lib/services/farmer_language_service.dart
