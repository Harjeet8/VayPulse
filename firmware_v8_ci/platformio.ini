[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    adafruit/Adafruit AHTX0
    adafruit/RTClib
    claws/BH1750
    milesburton/DallasTemperature
    paulstoffregen/OneWire
    olikraus/U8g2
