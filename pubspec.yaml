publish_to: "none"
version: 9.0.0+19

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  http: ^1.2.2
  image: ^4.3.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^19.5.0
  geolocator: ^13.0.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
