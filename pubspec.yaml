name: phytosense_ai
description: Farmer-first plant intelligence powered by ESP32 edge sensing.
publish_to: "none"
version: 9.1.3+904

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  http: ^1.2.2
  image: ^4.3.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.0
  geolocator: ^13.0.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/phytosense_icon.png
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansTamil-ExtraBold.ttf
          weight: 800
